on: pull_request
name: Review
env:
    COMPOSE_USER: runner
jobs:
    phpstan:
        runs-on: ubuntu-latest
        name: PHPStan
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Create docker network
              run: docker network create frontend

            - name: Run PHPStan
              run: |
                  docker compose run --rm frankenphp composer install --no-interaction
                  docker compose run --rm frankenphp vendor/bin/phpstan analyse

    worker-state:
        runs-on: ubuntu-latest
        name: Worker state audit
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Create docker network
              run: docker network create frontend

            # igor-php audits every shared service in the compiled container for
            # state that would leak between requests in a worker. It reads the
            # service map IgorPhpBundle writes during cache:clear, and fails only
            # on findings absent from igor-baseline.json — every entry in which
            # carries a reason. Regenerate with `composer worker-state-baseline`.
            - name: Audit shared services for worker-mode state leaks
              run: |
                  docker compose run --rm frankenphp composer install --no-interaction
                  docker compose run --rm frankenphp bin/console cache:clear
                  docker compose run --rm frankenphp composer worker-state-check

    phpunit:
        runs-on: ubuntu-latest
        name: PHP Unit tests
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Create docker network
              run: docker network create frontend

            - name: Run tests with coverage
              run: |
                  docker compose up --detach
                  docker compose exec -e XDEBUG_MODE=coverage frankenphp composer install --no-interaction
                  docker compose exec -e XDEBUG_MODE=coverage frankenphp bin/console --env=test doctrine:database:drop --if-exists --force --quiet
                  docker compose exec -e XDEBUG_MODE=coverage frankenphp bin/console --env=test doctrine:database:create --no-interaction --if-not-exists --quiet
                  docker compose exec -e XDEBUG_MODE=coverage frankenphp bin/console --env=test doctrine:migrations:migrate --no-interaction --quiet
                  docker compose exec -e XDEBUG_MODE=coverage frankenphp vendor/bin/phpunit --coverage-clover=coverage/unit.xml

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v7
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: ./coverage/unit.xml
                  fail_ci_if_error: true
                  flags: unittests

    build-assets:
        runs-on: ubuntu-latest
        name: Build assets
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Create docker network
              run: docker network create frontend

            - name: Build assets
              run: |
                  docker compose run --rm node yarn install
                  docker compose run --rm node yarn build
