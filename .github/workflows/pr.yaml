on: pull_request
name: Review
env:
    COMPOSE_USER: runner
jobs:
    validate-doctrine-schema:
        runs-on: ubuntu-latest
        name: Validate Doctrine Schema
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Create docker network
              run: docker network create frontend

            - name: Install and validate
              run: |
                  docker compose up --detach
                  docker compose exec phpfpm composer install --no-interaction
                  docker compose exec phpfpm bin/console doctrine:migrations:migrate --no-interaction
                  docker compose exec phpfpm bin/console messenger:setup-transports failed
                  docker compose exec phpfpm bin/console doctrine:schema:validate

    phpunit:
        runs-on: ubuntu-latest
        name: PHP Unit tests
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Create docker network
              run: docker network create frontend

            - name: Run tests
              run: |
                  docker compose up --detach
                  docker compose exec phpfpm composer install --no-interaction
                  docker compose exec phpfpm composer run tests

    fixtures:
        runs-on: ubuntu-latest
        name: Load fixtures
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Create docker network
              run: docker network create frontend

            - name: Load fixtures
              run: |
                  docker compose up --detach
                  docker compose exec phpfpm composer install --no-interaction
                  docker compose exec phpfpm bin/console doctrine:migrations:migrate --no-interaction
                  docker compose exec phpfpm composer fixtures

    build-assets:
        runs-on: ubuntu-latest
        name: Build assets
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Create docker network
              run: docker network create frontend

            - name: Build assets
              run: |
                  docker compose run --rm node yarn install
                  docker compose run --rm node yarn build
