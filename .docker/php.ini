; PHP settings for the FrankenPHP POC, mounted into
; /usr/local/etc/php/conf.d/.
;
; The itkdev/php8.4-fpm image turns a set of PHP_* environment variables into
; ini settings and ships a tuned baseline on top of php.ini-production. The
; published FrankenPHP image does neither, so both are reproduced here. Every
; variable is given a value in the docker-compose.frankenphp.* files — an unset
; one expands to the empty string and PHP warns.

; Set as env on itkdev/php8.4-fpm.
memory_limit = ${PHP_MEMORY_LIMIT}
max_execution_time = ${PHP_MAX_EXECUTION_TIME}
sendmail_path = ${PHP_SENDMAIL_PATH}

; itkdev/php8.4-fpm baseline. The FrankenPHP image leaves these at the
; development defaults: UTC, errors to the response body, no error log.
date.timezone = Europe/Copenhagen
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED
expose_php = Off

opcache.memory_consumption = 64
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

realpath_cache_size = 4096k
realpath_cache_ttl = 600

; PHP_XDEBUG_MODE and PHP_XDEBUG_WITH_REQUEST are what itkdev-docker-compose
; sets when starting with a debugger attached.
xdebug.mode = ${PHP_XDEBUG_MODE}
xdebug.start_with_request = ${PHP_XDEBUG_WITH_REQUEST}
xdebug.client_host = host.docker.internal
