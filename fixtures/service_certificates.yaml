App\Entity\ServiceCertificate:
    service_certificate/shop.example.com:
        domain: "shop.example.com"
        name: "CPR-opslag"
        description: |
            Bruges til opslag af CPR-numre.
        onePasswordUrl: "https://example.com/1password"
        expirationTime: <(new DateTime('+2 years'))>
        usageDocumentationUrl: https://example.com/shop/README.md#certificates

    service_certificate/intranet.example.com:
        domain: "intranet.example.com"
        name: "CVR-opslag"
        description: |
            Bruges til opslag af CVR-numre.
        onePasswordUrl: "https://example.com/1password"
        expirationTime: <(new DateTime('+4 years'))>
        usageDocumentationUrl: https://example.com/intranet/README.md#certificates

App\Entity\ServiceCertificate\Service:
    service/shop.example.com/digital-post:
        certificate: "@service_certificate/shop.example.com"
        type: "digital post"
        onePasswordUrl: "https://example.com/1password"

    service/shop.example.com/cpr-lookup:
        certificate: "@service_certificate/shop.example.com"
        type: "cpr lookup"
        onePasswordUrl: "https://example.com/1password"
