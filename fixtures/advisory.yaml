# Installations with packages, advisories, git repos and Drupal modules,
# shaped like production data. All names, versions and ids are made up: CVE ids
# use the year 2099 and git repos the example-org organization.
#
# - example-org/shop is checked out twice, stg on a branch and prod on a tag.
#   Both have the twig advisory, only prod has the http-foundation one.
# - example-org/intranet is a Drupal site whose modules reach advisories through
#   their Composer packages. drupal/core has a drupal.org and a Packagist
#   advisory for the same CVE.
# - release.example.com is deployed from a release download, so it has no git
#   repo, but it has advisories.
# - example-org/clean has no advisories.

App\Entity\GitRepo:
    git_repo/shop:
        provider: "github.com"
        organization: "example-org"
        repo: "shop"
    git_repo/intranet:
        provider: "github.com"
        organization: "example-org"
        repo: "intranet"
    git_repo/clean:
        provider: "github.com"
        organization: "example-org"
        repo: "clean"

App\Entity\GitTag:
    # A branch checkout has no tag.
    git_tag/shop-unknown:
        tag: "unknown"
        repo: "@git_repo/shop"
    git_tag/shop-2.4.1:
        tag: "2.4.1"
        repo: "@git_repo/shop"
    git_tag/intranet-1.8.0:
        tag: "1.8.0"
        repo: "@git_repo/intranet"
    git_tag/clean-1.0.0:
        tag: "1.0.0"
        repo: "@git_repo/clean"

App\Entity\Package:
    package/symfony-http-foundation:
        vendor: "symfony"
        name: "http-foundation"
        description: "Defines an object-oriented layer for the HTTP specification"
        license: "MIT"
    package/twig:
        vendor: "twig"
        name: "twig"
        description: "Twig, the flexible, fast, and secure template language for PHP"
        license: "BSD-3-Clause"
    package/league-commonmark:
        vendor: "league"
        name: "commonmark"
        description: "Highly-extensible PHP Markdown parser"
        license: "BSD-3-Clause"
    package/guzzle:
        vendor: "guzzlehttp"
        name: "guzzle"
        description: "Guzzle is a PHP HTTP client library"
        license: "MIT"
    package/drupal-core:
        vendor: "drupal"
        name: "core"
        description: "Drupal is an open source content management platform"
        license: "GPL-2.0-or-later"
    package/drupal-webform:
        vendor: "drupal"
        name: "webform"
        description: "Enables the creation of webforms and questionnaires"
        license: "GPL-2.0-or-later"

