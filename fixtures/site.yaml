        detectionResult: "@detection_result/docker-shop-stg"
        installation: "@installation/shop-stg"
        type: "docker"
        phpVersion: "8.3"
        __calls:
            - addDomain: ["@domain/stg.shop.example.com"]
    site/shop-prod:
        detectionResult: "@detection_result/docker-shop-prod"
        installation: "@installation/shop-prod"
        type: "docker"
        phpVersion: "8.3"
        __calls:
            - addDomain: ["@domain/shop.example.com"]
            - addDomain: ["@domain/www.shop.example.com"]
    site/clean:
        detectionResult: "@detection_result/docker-clean"
        installation: "@installation/clean"
        type: "docker"
        phpVersion: "8.4"
        __calls:
            - addDomain: ["@domain/clean.example.com"]
    site/intranet:
        detectionResult: "@detection_result/docker-intranet"
        installation: "@installation/intranet"
        type: "docker"
        phpVersion: "8.3"
        __calls:
            - addDomain: ["@domain/intranet.example.com"]
    # Served from a sub directory of the installation.
    site/legacy:
        detectionResult: "@detection_result/nginx-legacy"
        installation: "@installation/legacy"
        type: "nginx"
        phpVersion: "8.1"
        configFilePath: "/etc/nginx/sites-enabled/legacy.example.com"
        __calls:
            - addDomain: ["@domain/legacy.example.com"]
            - addDomain: ["@domain/www.legacy.example.com"]
    site/release:
        detectionResult: "@detection_result/nginx-release"
        installation: "@installation/release"
        type: "nginx"
        phpVersion: "8.3"
        configFilePath: "/etc/nginx/sites-enabled/release.example.com"
        __calls:
            - addDomain: ["@domain/release.example.com"]
