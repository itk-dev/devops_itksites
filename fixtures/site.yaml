    installation/shop-stg:
        detectionResult: "@detection_result/docker-shop-stg"
        type: "symfony"
        frameworkVersion: "6.4.20"
        phpVersion: "8.3.30"
        composerVersion: "2.8.5"
        lts: true
        eol: "11/2027"
        gitTag: "@git_tag/shop-unknown"
        gitClonedScheme: "https"
        __calls:
            - addPackageVersion:
                  ["@package_version/symfony-http-foundation-6.4.20"]
            - addPackageVersion: ["@package_version/twig-3.8.0"]
            - addPackageVersion: ["@package_version/guzzle-7.9.2"]
            - addDockerImageTag: ["@docker_image_tag/php8.3-fpm-latest"]
