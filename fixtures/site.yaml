# Detection results as the harvester reports them, and the installations,
# sites and domains built from them. Names, domains and versions are made up.
#
# web-stg-01  stg.shop.example.com     docker  example-org/shop at a branch
# web-prod-01 shop.example.com         docker  example-org/shop at 2.4.1
#             clean.example.com        docker  example-org/clean, no advisories
# web-prod-02 intranet.example.com     docker  example-org/intranet, Drupal
#             legacy.example.com       nginx   example-org/legacy, Symfony 5.4
#             release.example.com      nginx   release download, no git repo
#
# The data of each result is defined as a parameter and stored as JSON, as the
# harvester sends it. Each server's dir result lists all its installations,
# so replaying the fixtures keeps them.

parameters:
    # Composer packages as listed by composer show --format=json.
    installed_http_foundation_6_4_10: &http_foundation_6_4_10
        name: "symfony/http-foundation"
        version: "6.4.10"
        latest: "6.4.20"
        latest-status: "semver-safe-update"
        description: "Defines an object-oriented layer for the HTTP specification"
        abandoned: false
    installed_http_foundation_6_4_20: &http_foundation_6_4_20
        name: "symfony/http-foundation"
        version: "6.4.20"
        latest: "7.2.4"
        latest-status: "update-possible"
        description: "Defines an object-oriented layer for the HTTP specification"
        abandoned: false
    installed_twig_3_8_0: &twig_3_8_0
        name: "twig/twig"
        version: "3.8.0"
        latest: "3.11.2"
        latest-status: "semver-safe-update"
        description: "Twig, the flexible, fast, and secure template language for PHP"
        abandoned: false
    installed_guzzle_7_9_2: &guzzle_7_9_2
        name: "guzzlehttp/guzzle"
        version: "7.9.2"
        latest: "7.9.2"
        latest-status: "up-to-date"
        description: "Guzzle is a PHP HTTP client library"
        abandoned: false
    installed_commonmark_2_4_0: &commonmark_2_4_0
        name: "league/commonmark"
        version: "2.4.0"
        latest: "2.6.0"
        latest-status: "semver-safe-update"
        description: "Highly-extensible PHP Markdown parser"
        abandoned: false
    installed_drupal_core_10_3_5: &drupal_core_10_3_5
        name: "drupal/core"
        version: "10.3.5"
        latest: "10.4.2"
        latest-status: "semver-safe-update"
        description: "Drupal is an open source content management platform"
        abandoned: false
    installed_drupal_webform_6_2_9: &drupal_webform_6_2_9
        name: "drupal/webform"
        version: "6.2.9"
        latest: "6.2.10"
        latest-status: "semver-safe-update"
        description: "Enables the creation of webforms and questionnaires"
        abandoned: false

    # Advisories as reported by composer audit --format=json.
    audit_http_foundation: &audit_http_foundation
        advisoryId: "PKSA-x9q2-7fhd-3k1m"
        packageName: "symfony/http-foundation"
        affectedVersions: ">=6.0.0,<6.4.18|>=7.0.0,<7.2.4"
        title: "CVE-2099-10001: Example open redirect in Request::getUri()"
        cve: "CVE-2099-10001"
        link: "https://example.com/advisories/cve-2099-10001"
        reportedAt: "2026-02-11T10:00:00+00:00"
        sources:
            - name: "FriendsOfPHP/security-advisories"
              remoteId: "symfony/http-foundation/CVE-2099-10001.yaml"
    audit_twig: &audit_twig
        advisoryId: "PKSA-b4n7-2wqz-8c5r"
        packageName: "twig/twig"
        affectedVersions: ">=3.0.0,<3.11.2"
        title: "CVE-2099-10002: Example sandbox bypass"
        cve: "CVE-2099-10002"
        link: "https://example.com/advisories/cve-2099-10002"
        reportedAt: "2026-03-04T09:30:00+00:00"
        sources:
            - name: "FriendsOfPHP/security-advisories"
              remoteId: "twig/twig/CVE-2099-10002.yaml"
    audit_commonmark: &audit_commonmark
        advisoryId: "PKSA-m3r8-5tyv-1h6p"
        packageName: "league/commonmark"
        affectedVersions: ">=2.0.0,<2.6.0"
        title: "Example denial of service through nested lists"
        cve: null
        link: "https://example.com/advisories/ghsa-7f3m-q2kx-9w4c"
        reportedAt: "2026-04-20T14:15:00+00:00"
        sources:
            - name: "GitHub"
              remoteId: "GHSA-7f3m-q2kx-9w4c"
    audit_drupal_core: &audit_drupal_core
        advisoryId: "PKSA-d8k2-6vnp-4j9t"
        packageName: "drupal/core"
        affectedVersions: ">=8.0.0,<10.3.9|>=10.4.0,<10.4.2"
        title: "Drupal core - Moderately critical - Example access bypass"
        cve: "CVE-2099-10003"
        link: "https://example.com/advisories/sa-core-2099-001"
        reportedAt: "2026-05-13T17:00:00+00:00"
        sources:
            - name: "FriendsOfPHP/security-advisories"
              remoteId: "drupal/core/CVE-2099-10003.yaml"

    # Drupal modules as listed by drush pm:list --format=json.
    drupal_modules: &drupal_modules
        node:
            package: "Core"
            project: "drupal"
            path: "core/modules/node"
            status: "Enabled"
            version: "10.3.5"
        webform:
            package: "Webform"
            project: "webform"
            path: "modules/contrib/webform"
            status: "Enabled"
            version: "6.2.9"

    # Containers the harvester finds without a PHP application.
    nginx_container: &nginx_container
        name: "nginx"
        image: "nginx"
        version: "1.27-alpine"
        packages: "unknown"
        audit: "unknown"
        symfony: "unknown"
        drupal: "unknown"

    # dir: the installation roots on each server.
    dir_web_stg_01:
        - "/data/www/stg_shop_example_com/htdocs"
    dir_web_prod_01:
        - "/data/www/clean_example_com/htdocs"
        - "/data/www/shop_example_com/htdocs"
    dir_web_prod_02:
        - "/data/www/intranet_example_com/htdocs"
        - "/data/www/legacy_example_com/htdocs"
        - "/data/www/release_example_com/htdocs"
    dir_devops_01: []

    # docker: the domains and containers of a docker compose site.
    docker_shop_stg:
        domain: "stg.shop.example.com"
        containers:
            - name: "phpfpm"
              image: "example-org/php8.3-fpm"
              version: "latest"
              packages:
                  installed:
                      [*http_foundation_6_4_20, *twig_3_8_0, *guzzle_7_9_2]
              audit:
                  advisories:
                      twig/twig: [*audit_twig]
                  abandoned: {}
              symfony:
                  version: "6.4.20"
                  eof: "11/2027"
                  lts: "Yes"
                  phpVersion: "8.3.30"
              drupal: "unknown"
            - *nginx_container
            - name: "worker"
              image: "ghcr.io/example-org/shop-worker"
              version: "develop"
              packages: "unknown"
              audit: "unknown"
              symfony: "unknown"
              drupal: "unknown"
    docker_shop_prod:
        domain: "shop.example.com www.shop.example.com"
        containers:
            - name: "phpfpm"
              image: "example-org/php8.3-fpm"
              version: "latest"
              packages:
                  installed:
                      [*http_foundation_6_4_10, *twig_3_8_0, *guzzle_7_9_2]
              audit:
                  advisories:
                      symfony/http-foundation: [*audit_http_foundation]
                      twig/twig: [*audit_twig]
                  abandoned: {}
              symfony:
                  version: "6.4.10"
                  eof: "11/2027"
                  lts: "Yes"
                  phpVersion: "8.3.30"
              drupal: "unknown"
            - *nginx_container
            - name: "worker"
              image: "ghcr.io/example-org/shop-worker"
              version: "2.4.1"
              packages: "unknown"
              audit: "unknown"
              symfony: "unknown"
              drupal: "unknown"
    docker_clean:
        domain: "clean.example.com"
        containers:
            - name: "phpfpm"
              image: "example-org/php8.4-fpm"
              version: "latest"
              packages:
                  installed: [*guzzle_7_9_2]
              audit:
                  advisories: {}
                  abandoned: {}
              symfony:
                  version: "7.2.4"
                  eof: "07/2025 Expired"
                  lts: "No"
                  phpVersion: "8.4.5"
              drupal: "unknown"
            - *nginx_container
    docker_intranet:
        domain: "intranet.example.com"
        containers:
            - name: "phpfpm"
              image: "example-org/php8.3-fpm"
              version: "latest"
              packages:
                  installed:
                      [
                          *drupal_core_10_3_5,
                          *drupal_webform_6_2_9,
                          *commonmark_2_4_0,
                      ]
              audit:
                  advisories:
                      drupal/core: [*audit_drupal_core]
                      league/commonmark: [*audit_commonmark]
                  abandoned: {}
              symfony: "unknown"
              drupal: *drupal_modules
            - *nginx_container

    # nginx: a site served by nginx on the host.
    nginx_legacy:
        domain: "legacy.example.com www.legacy.example.com"
        phpVersion: "8.1"
        config: "/etc/nginx/sites-enabled/legacy.example.com"
    nginx_release:
        domain: "release.example.com"
        phpVersion: "8.3"
        config: "/etc/nginx/sites-enabled/release.example.com"

    # symfony and drupal: an application found on the host.
    symfony_legacy:
        composerVersion: "2.8.5"
        symfony:
            version: "5.4.52"
            eof: "02/2029"
            lts: "Yes"
            phpVersion: "8.1.31"
        packages:
            installed: [*twig_3_8_0, *guzzle_7_9_2]
        audit:
            advisories:
                twig/twig: [*audit_twig]
            abandoned: {}
    drupal_release:
        composerVersion: "2.8.5"
        version: "10.3.5"
        modules: *drupal_modules
        packages:
            installed: [*drupal_core_10_3_5, *drupal_webform_6_2_9]
        audit:
            advisories:
                drupal/core: [*audit_drupal_core]
            abandoned: {}

    # git: the remote, tag and uncommitted changes of a checkout.
    git_shop_stg:
        remotes: ["https://github.com/example-org/shop.git"]
        tag: "unknown"
        changes: []
    git_shop_prod:
        remotes: ["https://github.com/example-org/shop.git"]
        tag: "2.4.1"
        changes: []
    git_clean:
        remotes: ["https://github.com/example-org/clean.git"]
        tag: "1.0.0"
        changes: []
    git_intranet:
        remotes: ["https://github.com/example-org/intranet.git"]
        tag: "1.8.0"
        changes: ["?? .phpunit.cache/"]
    git_legacy:
        remotes: ["https://github.com/example-org/legacy.git"]
        tag: "0.9.3"
        changes: []

